/* 6. parent report */
function weekData(){
  const since=Date.now()-7*864e5,days=new Set(),topics={};
  const chats=loadChats().filter(c=>(c.ts||0)>=since);
  chats.forEach(c=>{days.add(new Date((c.ts||0)+6*3600e3).toISOString().slice(0,10));
    const key=c.mode==='solve'?subjName(c.subj||'math'):c.mode&&c.mode.startsWith('talk')?sx('pModes').talk+(c.mode.startsWith('talk:')?' · '+langName(c.mode.slice(5)):c.mode==='talk-en'?' · English':c.mode==='talk-ar'?' · العربية':''):sx('pModes').chat;
    topics[key]=(topics[key]||0)+1;});
  const tests=lsGet(SKEY.tests,[]).filter(x=>x.ts>=since);tests.forEach(x=>{days.add(new Date(x.ts+6*3600e3).toISOString().slice(0,10));const k=x.subject||'—';topics[k]=(topics[k]||0)+1;});
  const avg=tests.length?Math.round(tests.reduce((a,x)=>a+x.score/x.total,0)/tests.length*100):null;
  const R=lsGet(SKEY.routine,null);let rp=null;if(R&&R.days){const d=Object.keys(R.done).filter(k=>R.done[k]).length;rp={name:R.name,done:d,total:R.days.length};}
  return {chats:chats.length,qs:chats.reduce((a,c)=>a+(c.msgs||[]).filter(m=>m.role==='user').length,0),tests,avg,days:days.size,topics,rp};
}
function reportText(W){
  const lines=[`📊 Al Bayan AI · ${sx('pTitle')} (${sx('pWeek')})`,`${sx('pChats')}: ${num(W.qs)}`,`${sx('pDays')}: ${num(W.days)}/${num(7)}`,`${sx('pTests')}: ${num(W.tests.length)}${W.avg!=null?` · ${sx('pAvg')}: ${num(W.avg)}%`:''}`];
  const tp=Object.entries(W.topics).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>k);if(tp.length)lines.push(`${sx('pTopics')}: ${tp.join(', ')}`);

/* ---------- share a chat as a link ---------- */
async function shareChatLink(b,btn){
  const old=btn.innerHTML;btn.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';btn.disabled=true;
  try{
    const rows=[...thread.querySelectorAll('.row.bot')];const upto=rows.indexOf(b.closest('.row'));
    let bots=0;const msgs=[];
    for(const m of history){const c=m.role==='user'?(m.view||String(m.content).split('\n\n[ফাইল:')[0]):String(m.content);
      if(c&&c.trim())msgs.push({role:m.role,content:c});if(m.role==='assistant'&&upto>=0&&++bots>upto)break;}
    const first=msgs.find(m=>m.role==='user');
    const r=await fetch('/api/share',{method:'POST',headers:{'Content-Type':'application/json','x-lumina-device':deviceId},body:JSON.stringify({title:first?first.content.slice(0,80):'',msgs})});
    const j=await r.json();if(!r.ok||!j.id)throw 0;
    const url=location.origin+'/?s='+j.id;
    if(navigator.share){try{await navigator.share({title:'Al Bayan AI',text:(first?first.content.slice(0,100)+'\n':''),url});return;}catch(e){if(e&&e.name==='AbortError')return;}}
    try{await navigator.clipboard.writeText(url);}catch(e){prompt('',url);return;}
    alertNote(t('shareCopied'));
  }catch(e){alertNote(t('shareFail'));}
  finally{btn.innerHTML=old;btn.disabled=false;}
}
async function openShared(id){
  try{const r=await fetch('/api/share?id='+encodeURIComponent(id));if(!r.ok)throw 0;const j=await r.json();
    const cid='s_'+id;const all=loadChats().filter(c=>c.id!==cid);
    all.unshift({id:cid,title:j.title||'Al Bayan AI',ts:Date.now(),mode:null,msgs:j.msgs.map(m=>({role:m.role,content:m.content}))});
    storeChats(all.slice(0,40));openChat(cid);
    const bar=document.createElement('div');bar.className='shareBar';bar.textContent=t('sharedBar');thread.prepend(bar);window.scrollTo({top:0});
  }catch(e){alertNote(t('sharedGone'));}
}

const quizPool=()=>pack==='ai'?ALLV.map(w=>({q:w[0],a:w[1],a2:w[2]})):pack==='en'?Object.values(EN_WORDS).flat().map(w=>({q:w[0],a:w[2],a2:w[2]})):ALLV.map(w=>({q:w[0],a:w[1],a2:w[2]}));

  const P=quizPool();qItem=P[Math.floor(Math.random()*P.length)];
  qOpts=[qItem,...P.filter(v=>v.q!==qItem.q&&v.a!==qItem.a).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);

  qOpts.forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=(L==='en'&&pack==='ar')?v.a2:v.a;
    b.onclick=()=>{if(answered)return;answered=true;tot++;const fb=$('fb');
      if(v===qItem){sc++;b.classList.add('ok');const g=t('good');fb.textContent=g[Math.floor(Math.random()*g.length)];fb.style.color='var(--green)';}

async function ensureFonts(){ if(fontsReady) return;
  try{await Promise.all(['700 40px "Hind Siliguri"','500 40px "Hind Siliguri"','400 40px "Amiri"','700 40px "Amiri"','600 40px "Fraunces"','800 40px "Baloo Da 2"','700 40px "Baloo Da 2"','600 40px "Baloo Da 2"'].map(f=>document.fonts.load(f,'আA'+'ع')));}catch(e){}
  fontsReady=true; }
const BN="'Hind Siliguri','Fraunces',sans-serif", AR="'Amiri',serif";
function wrap(ctx,text,maxW){
  const out=[]; String(text||'').split('\n').forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean); let line='';
    words.forEach(w=>{const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW&&line){out.push(line);line=w;}else line=test;});
    if(line) out.push(line);});
  return out;
}
/* draws a vertical stack of text blocks, shrinking until it fits the box */
function stack(ctx,items,box,align){
  items=items.filter(it=>it.text&&String(it.text).trim());
  let sc=1,lay;
  for(;sc>0.35;sc-=0.04){
    let h=0; lay=items.map(it=>{const size=it.size*sc*(box.k||1);ctx.font=`${it.w||400} ${size}px ${it.f||BN}`;
      const lines=it.noWrap?[it.text]:wrap(ctx,it.text,box.w*(it.wf||1));const lh=size*(it.lh||1.35);
      const blockH=lines.length*lh;const gap=(it.gap||0)*sc*(box.k||1);h+=blockH+gap;return {it,size,lines,lh,gap,blockH};});
    if(h<=box.h){lay.total=h;break;}
    lay.total=h;
  }
  let y=box.y+(box.valign==='top'?0:box.valign==='bottom'?box.h-lay.total:(box.h-lay.total)/2);
  lay.forEach(({it,size,lines,lh,gap})=>{
    ctx.font=`${it.w||400} ${size}px ${it.f||BN}`;ctx.fillStyle=it.c;ctx.textBaseline='middle';
    const al=it.align||align;ctx.textAlign=al;ctx.direction=it.rtl?'rtl':'ltr';
    const x=al==='center'?box.x+box.w/2:al==='right'?box.x+box.w:box.x;
    if(it.before) it.before(ctx,x,y,size);
    lines.forEach(l=>{ if(it.pill){const tw=ctx.measureText(l).width,ph=size*1.7,pw=tw+size*1.6;const px=al==='center'?x-pw/2:al==='right'?x-pw:x;
        ctx.save();ctx.fillStyle=it.pill;roundRect(ctx,px,y,pw,ph,ph/2);ctx.fill();ctx.restore();ctx.fillStyle=it.c;ctx.fillText(l,al==='center'?x:al==='right'?x-size*.8:x+size*.8,y+ph/2);y+=ph;}
      else{ctx.fillText(l,x,y+lh/2);y+=lh;} });
    if(it.after) it.after(ctx,x,y,size);
    y+=gap;});
  ctx.direction='ltr';
  return y;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function star8(ctx,cx,cy,r){ctx.beginPath();for(let k=0;k<2;k++){ctx.save();ctx.translate(cx,cy);ctx.rotate(k*Math.PI/4);ctx.rect(-r,-r,2*r,2*r);ctx.restore();}}
function pattern(ctx,W,H,col,alpha,step){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,step/45);
  for(let y=0;y<H+step;y+=step)for(let x=((y/step)%2?step/2:0);x<W+step;x+=step){star8(ctx,x,y,step*.22);ctx.stroke();ctx.beginPath();ctx.arc(x,y,step*.08,0,7);ctx.stroke();}
  ctx.restore();}
function bgGrad(ctx,W,H,p,radial){let g;
  if(radial){g=ctx.createRadialGradient(W/2,H*.3,0,W/2,H*.3,Math.max(W,H)*.85);}else g=ctx.createLinearGradient(0,0,W*.6,H);
  g.addColorStop(0,p.bg1);g.addColorStop(1,p.bg2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function seeded(n){let x=n;return()=>{x=(x*9301+49297)%233280;return x/233280;};}
function crescent(ctx,cx,cy,r,col){const o=document.createElement('canvas');o.width=o.height=Math.ceil(r*2+4);const x=o.getContext('2d');x.fillStyle=col;x.beginPath();x.arc(r+2,r+2,r,0,7);x.fill();x.globalCompositeOperation='destination-out';x.beginPath();x.arc(r+2+r*.42,r+2-r*.22,r*.86,0,7);x.fill();ctx.save();ctx.shadowColor=col;ctx.shadowBlur=r*.35;ctx.drawImage(o,cx-r-2,cy-r-2);ctx.restore();}
function divider(ctx,x,y,w,col){ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.max(2,w/200);ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x-w*.08,y);ctx.moveTo(x+w*.08,y);ctx.lineTo(x+w/2,y);ctx.stroke();
  ctx.translate(x,y);ctx.rotate(Math.PI/4);const r=w*.03;ctx.fillRect(-r,-r,2*r,2*r);ctx.restore();}

function sanitizeSVG(txt){

  root.querySelectorAll('script,foreignObject,iframe,image,use[href^="http"],a').forEach(n=>n.remove());
  root.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{const v=a.value||'';if(/^on/i.test(a.name)||(/href$/i.test(a.name)&&!v.startsWith('#'))||/url\(\s*['"]?(?!#)/i.test(v)||/javascript:/i.test(v))n.removeAttribute(a.name);});});
  if(!root.getAttribute('xmlns'))root.setAttribute('xmlns','http://www.w3.org/2000/svg');
  return new XMLSerializer().serializeToString(root);
}

    else{if(dState.sel>=0){dState.sel=-1;renderStkCtl();rd();}return;}
    dc.setPointerCapture(e.pointerId);e.preventDefault();rd();});
  dc.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);if(drag.t==='s'){const s=dState.stk[drag.i];s.x=Math.min(1,Math.max(0,p.x-drag.dx));s.y=Math.min(1,Math.max(0,p.y-drag.dy));}
    else{const k=dState.tpl==='pframe'?1/.72:1;dState.panX=drag.px+(p.x-drag.x)*k;dState.panY=drag.py+(p.y-drag.y)*k;}rd();});
  const end=()=>{drag=null;};dc.addEventListener('pointerup',end);dc.addEventListener('pointercancel',end);})();
function renderStkCtl(){const c=$('stkCtl');if(!c)return;const s=(dState.stk||[])[dState.sel];c.style.display=s?'':'none';if(!s)return;$('stkSize').value=Math.round(s.s*100);}
function addSticker(e){dState.stk=dState.stk||[];dState.stk.push({e,x:.5+(Math.random()-.5)*.3,y:.4+(Math.random()-.5)*.3,s:.14});dState.sel=dState.stk.length-1;renderStkCtl();drawDesign();
  dc.style.touchAction='none';}
function buildEditTools(box){ // stickers + sliders, shared by AI pictures and frames
  box.innerHTML='';
  const h1=el('div','dEdL',t('stkL'));const row=el('div','chips dEdRow stkRow');STK.forEach(x=>{const b=el('button','chip',x);b.type='button';b.onclick=()=>addSticker(x);row.appendChild(b);});
  const ctl=el('div','stkCtl');ctl.id='stkCtl';ctl.style.display='none';const sl=document.createElement('input');sl.type='range';sl.min=5;sl.max=45;sl.id='stkSize';sl.oninput=()=>{const s=dState.stk[dState.sel];if(s){s.s=sl.value/100;drawDesign();}};
  const del=el('button','chip','🗑 '+t('stkDel'));del.type='button';del.onclick=()=>{dState.stk.splice(dState.sel,1);dState.sel=-1;renderStkCtl();drawDesign();};
  ctl.append(el('span','',t('stkSize')),sl,del);
  const h2=el('div','dEdL',t('adjL'));const adj=el('div','adjBox');
  [['b',t('adjB'),40,160],['c',t('adjC'),40,160],['s',t('adjS'),0,200]].forEach(([k,lb,mn,mx])=>{const r=el('label','adjRow');const i=document.createElement('input');i.type='range';i.min=mn;i.max=mx;i.value=dState.adj[k];i.oninput=()=>{dState.adj[k]=+i.value;drawDesign();};r.append(el('span','',lb),i);adj.appendChild(r);});
  const z=el('label','adjRow');const zi=document.createElement('input');zi.type='range';zi.min=100;zi.max=300;zi.value=Math.round(dState.zoom*100);zi.oninput=()=>{dState.zoom=zi.value/100;drawDesign();};z.append(el('span','',t('adjZ')),zi);adj.appendChild(z);
  const bt=el('div','chips dEdRow');const rot=el('button','chip','↻ '+t('adjRot'));rot.type='button';rot.onclick=()=>{dState.rot=(dState.rot+1)%4;drawDesign();};
  const rs=el('button','chip','⟲ '+t('adjReset'));rs.type='button';rs.onclick=()=>{Object.assign(dState,{adj:{b:100,c:100,s:100},zoom:1,panX:0,panY:0,rot:0});buildEditTools(box);drawDesign();};bt.append(rot,rs);
  box.append(h1,row,ctl,h2,adj,bt);renderStkCtl();}
function renderPF(){const box=$('pfBox');if(!box)return;const on=dMode==='frame';box.style.display=on?'':'none';if(!on)return;
  const g=$('pfTiles');g.innerHTML='';PF.forEach((f,i)=>{const b=el('button','pfTile'+(i===dState.pfk?' on':''));b.type='button';b.style.background=`linear-gradient(140deg,${f.c1},${f.c2})`;b.style.color=f.acc==='#f42a41'?'#fff':f.acc;b.textContent=f[L]||f.bn;b.onclick=()=>{dState.pfk=i;$('pfText').style.display=f.k==='custom'?'':'none';renderPF();drawDesign();};g.appendChild(b);});
  $('pfText').style.display=PF[dState.pfk].k==='custom'?'':'none';$('pfText').placeholder=t('pfTypeHint');buildEditTools($('pfTools'));}
async function pfLoad(f){if(!f)return;const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{dState.pf=im;Object.assign(dState,{zoom:1,panX:0,panY:0,rot:0});dc.style.touchAction='none';markMade();drawDesign();renderPF();};im.src=url;}

async function makeArt(){
  const q=$('dPrompt').value.trim();if(!q)return;
  if(left('design')<=0){$('dStatus').textContent=limitText('design');openPlans();return;}
  if(dRef&&left('upload')<=0){$('dStatus').textContent=limitText('upload');openPlans();return;}
  const [W,H]=D_SIZES[dState.size];const style=t('artStyles')[artStyle];
  const prompt=ART_SYS.replace(/\{W\}/g,W).replace(/\{H\}/g,H)+`\n\nStyle: ${['photorealistic photograph, natural light, sharp focus, 35mm','cinematic film still, dramatic lighting, rich colour grading','detailed digital painting, concept art','anime illustration, clean lines, vibrant colours','flat vector illustration','minimal, lots of white space, few colours','Islamic geometric art with arabesque ornaments','soft watercolour look (use blurred, translucent layered shapes)','clean line art with a few accent colours','glossy 3D-looking shapes with highlights and shadows','cute, friendly cartoon style','dreamy night scene with glowing light'][artStyle]||'flat vector'}.\nCanvas: ${W}×${H}.${dRef?'\nA reference photo is attached: use its subject, colours or composition as inspiration (do not trace a real person).':''}\nRequest: ${q}`;
  const st=$('dStatus');st.textContent=t('dArtMaking');dBusy(true,t('dArtMaking'));
  if(!window.claude){
    // words, names or dates in the picture -> the poster maker draws crisp Bangla text; AI images garble letters
    if(/পোস্টার|ব্যানার|লিফলেট|ফ্লায়ার|কার্ড|শুভেচ্ছা|মাহফিল|দারস|ওয়াজ|আলোচনা সভা|বিজ্ঞপ্তি|ভর্তি|লেখা থাকবে|লিখে দাও|নাম লেখা|poster|banner|flyer|leaflet|greeting card|invitation|notice|with (the )?text|write /i.test(q)){
      st.textContent=t('dToPoster');setDMode('poster');dBusy(false);return makeDesign();}
    try{
      const styleEn=(STYLE_LIST[artStyle]||'');
      const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-lumina-device':deviceId},body:JSON.stringify({task:'imgprompt',uploads:dRef?1:0,images:dRef?[await blobToB64(dRef.blob)]:undefined,messages:[{role:'user',content:'Request: '+q+'\nStyle: '+styleEn}]})});
      if(res.status===429){const j=await res.json().catch(()=>({}));if(j.error==='limit'){applyServerUsage(j.usage);st.textContent=limitText(j.kind||'design');openPlans();dBusy(false);return;}}
      if(!res.ok) throw new Error('http');
      const jj=await res.json();applyServerUsage(jj.usage);const ip=String(jj.text||'').trim();
      if(!ip||/^BLOCKED/i.test(ip)){st.textContent=t('dArtBlocked');dBusy(false);return;}
      if(/^POSTER/i.test(ip)){st.textContent=t('dToPoster');setDMode('poster');dBusy(false);return makeDesign();}
      useLocal('design',1);if(dRef)useLocal('upload',1);
      artLast={q};const ok=await artVariants(ip,W,H);
      if(!ok){st.textContent=t('dArtFail');dBusy(false);return;}
      $('dUseArt').style.display='';dBusy(false);return;
    }catch(e){st.textContent=t('dArtFail');dBusy(false);return;}
  }
  try{
    let text;
    if(window.claude){
      if(!sample) throw new Error('unavailable');
      const opts={cache:false,modelTier:'complex'};if(dRef)opts.images=[dRef.blob];
      text=(await sample(prompt,opts)).text;
    }else{
      const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-lumina-device':deviceId},body:JSON.stringify({task:'art',uploads:dRef?1:0,images:dRef?[await blobToB64(dRef.blob)]:undefined,messages:[{role:'user',content:prompt}]})});
      if(res.status===429){const j=await res.json().catch(()=>({}));if(j.error==='limit'){applyServerUsage(j.usage);st.textContent=limitText(j.kind||'design');openPlans();return;}}
      if(!res.ok) throw new Error('http');const jj=await res.json();applyServerUsage(jj.usage);text=jj.text;
    }
    const svg=sanitizeSVG(text);dState.art=await svgToImage(svg,W,H);dState.artSvg=svg;dState.tpl='art';
    useLocal('design',1);if(dRef)useLocal('upload',1);
    renderDesignUI();await drawDesign();markMade();st.textContent=t('dArtDone');$('dUseArt').style.display='';
    $('dCanvas').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){st.textContent=t('dArtFail');}
  finally{dBusy(false);}
}
$('dUseArt').onclick=()=>{if(!dState.art)return;dState.photo=dState.art;dState.tpl='photo';$('fPhotoX').style.display='';fillDefaults();setDMode('poster');drawDesign();};
function setDMode(m){const was=dMode;dMode=m;if(m==='frame'){dState.size=0;dState.tpl='pframe';dState.stk=[];dState.sel=-1;Object.assign(dState,{adj:{b:100,c:100,s:100},zoom:1,panX:0,panY:0,rot:0});setTimeout(()=>{markMade();drawDesign();},0);}else if(was==='frame'){dState.stk=[];dState.sel=-1;dc.style.touchAction='';if(dState.tpl==='pframe')dState.tpl=m==='art'?'art':'islamic';}setTimeout(renderBoard,0);setTimeout(renderGal,0);setTimeout(renderArtEdit,0);if(m!=='art'){const r=$('dRefine');if(r)r.style.display='none';}renderDesignUI();}
/* Al Bayan AI designs it */
const DESIGN_SYS=`You design social posts, posters and banners for Al Bayan AI's design tool. Return ONLY a JSON object, no other text:
{"template":"majlis|dawah|islamic|eid|event|quote|notice|photo|minimal|modern","palette":0-7,"size":0-6,"arabic":"","title":"","subtitle":"","body":"","footer":"","x":{}}
Templates: majlis = Islamic programme, dars, waz/mahfil, Jumu'ah talk, lecture, conference, seminar, Quran class (rich poster with mosque photo, lanterns, info cards); dawah = Islamic reminder/advice/infographic with an ayah and several points or tips; islamic = short Islamic greeting/reminder/dua; eid = Eid, Ramadan, festive greetings; event = non-religious event, admission, offer banner; quote = quote/saying/motivation; notice = notice, announcement, rules, list; photo = only if the user mentions their own photo; minimal = clean professional; modern = trendy social post. Prefer majlis for any Islamic talk/programme and dawah for Islamic advice with points.
Palettes: 0 green-gold (best for majlis), 1 night blue-gold (best for dawah), 2 maroon-gold, 3 black-gold, 4 light cream-green, 5 white-blue, 6 Al Bayan red-white (brand), 7 white with red.
Sizes: 0 square post, 1 story/status, 2 Facebook cover/banner, 3 A4 poster, 4 YouTube thumbnail, 5 portrait poster 4:5 (default for majlis), 6 landscape 5:4 (default for dawah). Follow the request words (ব্যানার/banner→2 or 6, পোস্টার/poster→5 or 3, স্টোরি/status→1, থাম্বনেইল→4).
For majlis fill "x": {"kicker":"short top label e.g. জুমাবারের / সাপ্তাহিক / মাসিক","title":"1-2 big words e.g. হালকায় / তাফসীর মাহফিল","title2":"optional second headline","topicLabel":"বিষয়","topic":"the topic","speakerLabel":"দারস পেশ করবেন / আলোচক","speaker":"name","speakerInfo":"up to 2 short lines separated by \\n","info":[{"icon":"date|time|place|online|phone","label":"সময় ও স্থান","text":"line 1\\nline 2"}],"orgs":["organiser names, max 3"],"scene":"mosque|quran|kaaba|madinah|night|ramadan|nature|books"}. Max 3 info cards.
For dawah fill "x": {"title":"first headline line","title2":"second headline line (shown in gold)","arabic":"ayah Arabic","meaning":"its translation","ref":"সূরা ... : আয়াত","pointsLabel":"heading for the points","points":[{"icon":"book|pray|hands|ban|people|heart|mosque|moon|coin|star|time","text":"2-5 words"}],"quoteLabel":"e.g. হাদিসে এসেছে","quote":"","quoteRef":"","dua":"closing dua line ending with আমীন","scene":"kaaba|madinah|mosque|quran|night|nature"}. 3-5 points.
Also fill the plain fields (title, subtitle, footer) with the main headline, a short line and the organiser, so other templates still work.
Text rules: write in the user's language (Bangla by default). Keep every line short. Use exactly the names, dates, times, places, links and organisers the user gives. When a detail is unknown use a placeholder like "[তারিখ]", "[সময়]", "[স্থান]", "[বক্তার নাম]"; never invent real names, titles, phone numbers, dates or addresses.
Arabic: with full harakat. Only well-known phrases (e.g. بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ, جُمُعَةٌ مُبَارَكَةٌ, عِيدٌ مُبَارَكٌ) or a Quran ayah you fetched with get_quran_verses (copy its Arabic exactly and give the reference). Never write an ayah from memory. Hadith: only put a hadith in "quote" if the user gave its text; otherwise leave quote, quoteLabel and quoteRef as "".`;
function parseJSON(txt){const m=String(txt||'').match(/\{[\s\S]*\}/);if(!m)throw new Error('no json');
  try{return JSON.parse(m[0]);}catch(e){let out='',inS=false,esc=false;for(const ch of m[0]){
    if(inS){if(esc){esc=false;out+=ch;continue;}if(ch==='\\'){esc=true;out+=ch;continue;}if(ch==='"'){inS=false;out+=ch;continue;}if(ch==='\n'){out+='\\n';continue;}if(ch==='\r')continue;out+=ch;}
    else{if(ch==='"')inS=true;out+=ch;}}return JSON.parse(out);}}
function dBusy(on,txt){$('dGo').disabled=!!on;$('v-design').classList.toggle('busy',!!on);if(txt)$('dBusyT').textContent=txt;if(on)$('v-design').scrollIntoView({behavior:'smooth',block:'start'});}
async function makeDesign(){
  const q=$('dPrompt').value.trim();if(!q)return;
  if(left('design')<=0){$('dStatus').textContent=limitText('design');openPlans();return;}
  const st=$('dStatus');st.textContent=t('dMaking');dBusy(true,t('dMaking'));
  try{
    let d;
    if(window.claude){
      if(!sample) throw new Error('unavailable');
      const input=[{role:'user',content:DESIGN_SYS+"\n\nRequest: "+q}];
      const o={cache:false,tools:TOOLS.filter(x=>x.name==='get_quran_verses')};if(dRef){o.images=[dRef.blob];input[0].content+='\n(A reference photo is attached: read any text or details from it and use them.)';}
      const r=await sample(input,o);d=parseJSON(r.text);
    }else{
      const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-lumina-device':deviceId},body:JSON.stringify({task:'design',uploads:dRef?1:0,images:dRef?[await blobToB64(dRef.blob)]:undefined,messages:[{role:'user',content:q+(dRef?'\n(A reference photo is attached: read any text or details from it and use them.)':'')}]})});
      if(res.status===429){const j=await res.json().catch(()=>({}));if(j.error==='limit'){applyServerUsage(j.usage);$('dStatus').textContent=limitText('design');openPlans();return;}}
      if(!res.ok) throw new Error('http');const jj=await res.json();applyServerUsage(jj.usage);d=parseJSON(jj.text);
    }
    const ti=D_TPLS.indexOf(d.template);if(ti>=0&&!(d.template==='photo'&&!dState.photo))dState.tpl=d.template;
    if(Number.isInteger(+d.palette)&&D_PAL[+d.palette])dState.pal=+d.palette;
    if(Number.isInteger(+d.size)&&D_SIZES[+d.size])dState.size=+d.size;
    dState.x=d.x&&typeof d.x==='object'?d.x:null;if((d.template==='majlis'||d.template==='dawah')&&!(Number.isInteger(+d.size)&&+d.size>=5&&D_SIZES[+d.size]))dState.size=d.template==='majlis'?5:6;
    $('fAr').value=d.arabic||'';$('fTitle').value=d.title||'';$('fSub').value=d.subtitle||'';$('fBody').value=(d.body||'').replace(/\\n/g,'\n');$('fFoot').value=d.footer||'';
    useLocal('design',1);if(dRef)useLocal('upload',1);
    markMade();
    renderDesignUI();await drawDesign();st.textContent=t('dDone');
    $('dCanvas').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){st.textContent=t('dFail');}
  finally{dBusy(false);}
}
$('dForm').addEventListener('submit',e=>{e.preventDefault();dMode==='art'?makeArt():makeDesign();});
$('dPrompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){e.preventDefault();dMode==='art'?makeArt():makeDesign();}});

/* save */
let downloads=null;
if(window.claude)(async()=>{try{downloads=await window.claude.use('downloads')}catch(e){downloads=null}})();
function hdCanvas(){ // 2x copy with gentle sharpening for AI pictures; posters are already sharp vector text
  if(dState.tpl!=='art'||!dState.art)return dc;
  const c=document.createElement('canvas');c.width=dc.width*2;c.height=dc.height*2;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(dc,0,0,c.width,c.height);
  try{const im=x.getImageData(0,0,c.width,c.height),d=im.data,o=new Uint8ClampedArray(d),w=c.width*4,a=.35;
    for(let i=w;i<d.length-w;i++){if((i&3)===3)continue;const v=o[i]*(1+4*a)-a*(o[i-4]+o[i+4]+o[i-w]+o[i+w]);d[i]=v;}x.putImageData(im,0,0);}catch(e){}
  return c;}
$('dSave').onclick=async()=>{
  dState.sel=-1;try{renderStkCtl()}catch(e){}await drawDesign();const hc=hdCanvas();
  const blob=await new Promise(r=>hc.toBlob(r,'image/png'));
  const name=('lumina-'+($('fTitle').value||'design').replace(/[^\p{L}\p{N}]+/gu,'-').slice(0,40)+'.png');
  if(window.claude){
    if(downloads){try{await downloads.save({filename:name,data:blob});$('dStatus').textContent=t('dSaved');return;}catch(e){if(e&&e.code==='declined')return;}}
    $('dImg').src=dc.toDataURL('image/png');$('dModal').classList.add('on');return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  if(/iPhone|iPad|Android/i.test(navigator.userAgent)){$('dImg').src=hc.toDataURL('image/png');$('dModal').classList.add('on');}
};
$('dClose').onclick=()=>$('dModal').classList.remove('on');
document.querySelector('.tabs button[data-v="design"]').addEventListener('click',()=>{fillDefaults();drawDesign();});
function markMade(){$('v-design').classList.add('made');}

loadLocal();applyLang();newQ();syncUsage();
